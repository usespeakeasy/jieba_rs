name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4.4.0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install uv
        uses: astral-sh/setup-uv@v5.4.2

      - name: Set Python version
        run: echo "${{ matrix.python-version }}" > .python-version

      - name: Sync
        run: uv sync

      - name: Build extension
        run: uv run maturin develop --release

      - name: Cargo tests (core)
        run: cargo test -p jieba-core --release

      - name: Rust formatting
        run: cargo fmt --all -- --check

      - name: Rust lint
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Pytest (parity + behaviors)
        run: uv run pytest -q

  build-wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.4.0
      - uses: astral-sh/setup-uv@v5.4.2
      - name: Build wheel + sdist
        run: uv build
      - name: Smoke test wheel in isolated env
        run: |
          WHEEL=$(ls dist/*.whl)
          uv run --isolated --no-project --with "$WHEEL" \
            python -c "import jieba_rs, jieba_rs.finalseg, jieba_rs.analyse.tfidf; assert jieba_rs.lcut('我来到北京清华大学') == ['我','来到','北京','清华大学']; assert type(jieba_rs.cut('北京')).__name__ == 'generator'; print('ok')"
          uv run --isolated --no-project --with "$WHEEL" python -m jieba_rs --help
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: dist
          path: dist/
